[package]
name = "unkai-plugins"
version = "0.1.0"
edition = "2021"

[lib]
name = "unkai_plugins"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1"

# Internal
engine-core = { path = "../engine-core" }

# Optional plugins
reqwest = { version = "0.11", features = ["json"], optional = true }

[features]
default = ["http-plugin"]
http-plugin = ["reqwest"]

[dev-dependencies]
