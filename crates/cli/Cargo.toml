[package]
name = "unkai-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "unkai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# Internal crates
engine-core = { path = "../engine-core" }
platform-windows = { path = "../platform-windows" }

[dev-dependencies]
