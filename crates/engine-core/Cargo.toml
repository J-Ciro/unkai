[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "engine_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Concurrency
dashmap = "5"
parking_lot = "0.12"

# System metrics
sysinfo = "0.30"

# File watching (hot-reload)
notify = "6"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for widget IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Directory utilities
dirs = "5"

# Template engine
regex = "1"

[dev-dependencies]
tokio-test = "0.4"
