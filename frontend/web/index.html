<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unkai - Simple Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>unkai - Simple Bar</h1>
        
        <!-- Status -->
        <div id="status" class="status">
            <p>Connecting...</p>
        </div>

        <!-- Widgets Container -->
        <div id="widgets" class="widgets-container">
            <!-- Widgets renderizadas aquí -->
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="btn-reload">Reload Config</button>
            <button id="btn-debug">Toggle Debug</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
